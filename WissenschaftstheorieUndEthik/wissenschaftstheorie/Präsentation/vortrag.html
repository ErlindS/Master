<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theorienstatik</title>
<style>
:root{
  --bg:#eceef0; --surface:#fbfcfd; --surface2:#f3f5f7;
  --ink:#15181c; --ink2:#444b54; --muted:#79818b;
  --line:#c3c9d0; --rule:#aab2bb;
  --accent:#44596b; --accent-soft:#dfe5ea;
  --shadow:0 1px 2px rgba(18,22,26,.07), 0 6px 18px rgba(18,22,26,.05);
  --font:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="dark"]{
  --bg:#0e1114; --surface:#171b20; --surface2:#1d2229;
  --ink:#e7eaed; --ink2:#b3bac2; --muted:#7d868f;
  --line:#2d343c; --rule:#3a424b;
  --accent:#9db4c6; --accent-soft:#222a32;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv05";}

#stage{position:fixed;inset:0;overflow:hidden}
#cam{position:absolute;top:0;left:0;transform-origin:0 0;
  transition:transform 1100ms cubic-bezier(.62,.02,.24,1);will-change:transform}

/* ---------- Knoten ---------- */
.node{position:absolute;background:var(--surface);border:2px solid var(--line);border-radius:18px;
  padding:34px 42px;box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px) scale(.985);
  transition:opacity 520ms ease, transform 520ms cubic-bezier(.3,0,.2,1), border-color 400ms ease, background 400ms ease,
    left 1100ms cubic-bezier(.62,.02,.24,1), top 1100ms cubic-bezier(.62,.02,.24,1),
    width 1100ms cubic-bezier(.62,.02,.24,1), height 1100ms cubic-bezier(.62,.02,.24,1);
  display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.node.on{opacity:1;transform:none}
.node .num{font-size:38px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.06em;margin-bottom:10px}
.node .t{font-size:90px;line-height:1.14;font-weight:600;letter-spacing:-.015em}
.node .s{font-size:50px;line-height:1.3;color:var(--ink2);margin-top:18px;font-weight:400}
.node .s em{color:var(--muted);font-style:normal}

.node.root{background:var(--surface2);border-color:var(--rule);border-width:1.5px}
.node.root .t{font-size:112px;letter-spacing:-.025em}
.node.root .s{font-size:50px;color:var(--muted)}

.node.sec{background:transparent;border:none;box-shadow:none;padding:0}
.node.sec .t{font-size:112px;letter-spacing:-.025em}
.node.sec .s{font-size:50px;color:var(--muted);margin-top:16px}
.node.sec::after{content:"";display:block;width:180px;height:4px;background:var(--rule);margin-top:34px}

.node.kid{background:var(--surface);min-height:200px}
.node.kid .t{font-size:48px;font-weight:550;line-height:1.16}
.node.kid .s{font-size:36px;margin-top:12px}

.node.form{background:var(--surface2);border-style:solid}
.node.form .t{font-family:var(--mono);font-size:44px;font-weight:500;letter-spacing:-.015em;line-height:1.45}
.node.form .s{font-family:var(--font);font-size:34px}

.node.key{border-color:var(--accent);background:var(--accent-soft)}
/* Beispielkasten — der rote Faden */
.node.ex{background:var(--accent-soft);border-color:var(--accent)}
.node.ex .t{font-size:34px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);font-weight:600}
.node.ex .s{font-size:36px;line-height:1.52;color:var(--ink2);margin-top:16px}
.node .s b{color:var(--ink);font-weight:600}

/* Schlussbild */
.node.final{background:var(--accent-soft);border-color:var(--accent);padding:44px 54px;min-height:0}
.node.final .t{font-size:62px;letter-spacing:-.02em}
.node.final .s{font-size:44px;line-height:1.9;margin-top:26px}
.node.final .s b{color:var(--accent);font-variant-numeric:tabular-nums}
.node.final .s em{color:var(--muted);font-style:normal}

/* Gliederung */
.node.agenda{background:transparent;border:none;box-shadow:none;padding:16px 0;min-height:0;
  border-bottom:1.5px solid var(--line);border-radius:0;display:block}
.node.agenda .t{display:inline;font-size:46px;color:var(--accent);font-variant-numeric:tabular-nums}
.node.agenda .s{display:inline;font-size:44px;margin-left:44px;color:var(--ink)}
.node.agenda .s em{color:var(--muted);font-style:normal}

/* Netzdiagramm im Lösungsband */
.node.net .s{margin-top:18px}
.node.net svg{width:100%;height:auto;display:block}
.node.net svg text{fill:currentColor}
.node.net svg .bx{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}
.node.net svg .me{fill:var(--surface2);stroke:var(--accent);stroke-width:4}
.node.net svg .ln{stroke:var(--accent);stroke-width:3;fill:none}
.node.net svg .lb{fill:var(--accent);font-size:38px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.node.net svg .ti{font-size:50px;font-weight:600}
.node.net svg .su{font-size:36px;opacity:.72}

/* Dauerstreifen mit der Beispieltheorie auf jeder Achsenfolie */
.node.strip{background:transparent;border:none;border-bottom:2px solid var(--line);border-radius:0;
  box-shadow:none;padding:0 0 26px 0}
.node.strip .t{font-size:30px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.node.strip .s{font-size:40px;line-height:1.62;margin-top:16px}

/* Folienmodus: unterste Ebene sieht aus wie eine gewöhnliche Folie */
#cam[data-mode="slide"] .node.head{background:transparent;border:none;border-bottom:4px solid var(--rule);
  border-radius:0;box-shadow:none;padding:0 0 26px 0}
#cam[data-mode="slide"] .node.head .t{font-size:104px}
#cam[data-mode="slide"] .node.head .s{font-size:48px;color:var(--muted)}
#cam[data-mode="slide"] .node.kid{border-radius:12px}
#cam[data-mode="slide"] .node.kid.form{min-height:0;padding:24px 34px}
#cam[data-mode="slide"] .node.ex{padding:26px 34px}
/* Ansichtspunkte im Folienmodus einzeilig */
#cam[data-mode="slide"] .node.kid:not(.ex):not(.strip):not(.form){display:block;min-height:0;padding:22px 34px}
#cam[data-mode="slide"] .node.kid:not(.ex):not(.strip):not(.form) .t,
#cam[data-mode="slide"] .node.kid:not(.ex):not(.strip):not(.form) .s{display:inline}
#cam[data-mode="slide"] .node.kid:not(.ex):not(.strip):not(.form) .s{margin-left:40px}
/* Lösungsband */
#cam[data-mode="slide"] .node.ex .s{font-size:38px;line-height:1.5}

.node.q{background:transparent;border:none;box-shadow:none;align-items:flex-start}
.node.q .t{font-size:170px;letter-spacing:-.035em;font-weight:600}
.node.q .s{font-size:44px;color:var(--muted);margin-top:22px}

/* ---------- Kanten ---------- */
#cam.measuring, #cam.measuring *{transition:none !important}

#cam[data-z="far"] .node.head .s{opacity:0;height:0;margin-top:0;overflow:hidden;transition:opacity 260ms ease}
#cam[data-z="near"] .node.head .s{opacity:1;transition:opacity 500ms ease 250ms}

#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke:var(--rule);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke-dashoffset 760ms cubic-bezier(.55,0,.25,1), opacity 300ms ease;opacity:0}
#wires path.on{opacity:1}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:20px;
  padding:0 24px;font-size:13px;color:var(--muted);letter-spacing:.055em;text-transform:uppercase;
  background:linear-gradient(to top,var(--bg) 55%,transparent);z-index:20}
#hud b{font-weight:500;color:var(--ink2);text-transform:none;letter-spacing:.01em;font-size:14px}
#bar{position:fixed;left:0;top:0;height:2px;background:var(--accent);width:0;
  transition:width 600ms cubic-bezier(.5,0,.2,1);z-index:21}
#clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px}
#clock.run{color:var(--ink2)}

#notes{position:fixed;left:24px;right:24px;bottom:58px;max-width:900px;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:16px 20px;
  font-size:17px;line-height:1.5;color:var(--ink2);box-shadow:var(--shadow);z-index:19;display:none}
#notes.on{display:block}
#notes .cue{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}

#help{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 93%,transparent);z-index:30;
  display:none;align-items:center;justify-content:center}
#help.on{display:flex}
#help div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:34px 42px;
  box-shadow:var(--shadow);font-size:18px;line-height:2.05}
#help kbd{font-family:var(--mono);font-size:15px;background:var(--surface2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:2px 8px;margin-right:12px;color:var(--ink)}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="cam"><svg id="wires"></svg></div></div>
<div id="hud"><span id="chap"></span><b id="cue"></b><span id="clock">00:00</span></div>
<div id="notes"><span class="cue">Notiz</span><span id="ntext"></span></div>
<div id="help"><div>
  <p><kbd>&rarr;</kbd> weiter &nbsp; <kbd>&larr;</kbd> zurück</p>
  <p><kbd>N</kbd> Notizen &nbsp; <kbd>T</kbd> hell / dunkel</p>
  <p><kbd>O</kbd> Gesamtkarte &nbsp; <kbd>Pos1</kbd> Anfang</p>
  <p><kbd>L</kbd> Uhr starten / anhalten &nbsp; <kbd>F</kbd> Vollbild &nbsp; <kbd>R</kbd> Layout neu berechnen</p>
  <p><kbd>?</kbd> schließen</p>
</div></div>

    R.stripNode=mk({id:R.id+'T', cls:'kid strip', num:'', t:R.strip.t, s:R.strip.s, tw:SL_W, tx:CW/2});
  }
  const parent=R.cardNode||R.sec;
  const c=R.heads.length, startX=CW/2-(c-1)*COLW/2;
  R.headNodes=[];
  R.heads.forEach((H,i)=>{
    const hid=R.id+(i+1);
    const hn=mk({id:hid, cls:'head', num:H.n, t:H.t, s:H.s, tw:NW, sw:SL_W, tx:startX+i*COLW});
    hn.kids=[]; R.headNodes.push(hn); ids.push(hid);
    edges.push({id:'e-'+parent.id+'-'+hid, a:parent.id, b:hid, kind:'curve'});
    const hasEx=H.kids.some(k=>k.ex);
    H.kids.forEach((K,j)=>{
      const kn=mk({id:hid+'k'+(j+1), cls:'kid '+(K.k||''), num:'', t:K.t, s:K.s||'',
                   tw:KW, sw:SL_W, tx:hn.tx+70, ex:!!K.ex});
      hn.kids.push(kn); ids.push(kn.id);
      edges.push({id:'e-'+hid+'-'+kn.id, a:hid, b:kn.id, kind:'bus'});
    });
  });
  if(R.synth){
    R.synthNode=mk({id:R.id+'S', cls:'kid '+(R.synth.k||''), num:'', t:R.synth.t, s:R.synth.s, tw:2600, tx:CW/2});
    R.synthId=R.synthNode.id; ids.push(R.synthId);
    R.synth.from.forEach(f=>edges.push({id:'e-'+f+'-'+R.synthId, a:f, b:R.synthId, kind:'curve'}));
  }
  if(R.qnote!==null){
    R.qNode=mk({id:R.id+'Q', cls:'q', num:'', t:'Fragen?', s:R.chap, tw:1900, tx:CW/2});
    R.qId=R.qNode.id; ids.push(R.qId);
  }
  R.ids=ids; R.secId=R.sec.id;
});
const FIN=mk({id:'FN', cls:'kid final', num:'', t:'Die Fiebertheorie durch das ganze Kapitel',
  s:'<b>5.3.1</b>&nbsp;&nbsp; Vier Fragen an K, Z, H, P — und P allein ist der empirische Gehalt.<br>'+
    '<b>5.3.2</b>&nbsp;&nbsp; Dieselbe Theorie als <em>ein Element im Netz</em>: Vortheorie, externe Theorie, Reduktion.<br>'+
    '<b>5.4.1</b>&nbsp;&nbsp; Die Anzeige 36,8 — und die Logik sagt nicht, ob K, Z oder H fällt.<br>'+
    '<b>5.4.2</b>&nbsp;&nbsp; „Kontakt → über 38 °C“ aus zwei gehaltlosen Sätzen: dafür braucht es „Infektion“.<br>'+
    '<b>5.5</b>&nbsp;&nbsp;&nbsp;&nbsp; Dieselbe Lage bei Piaget: S1, I2 — oder doch K1?', tw:2900, tx:CW/2});
const CLOSE=mk({id:'ZZ', cls:'sec', num:'', t:'5.6 Theoriendynamik',
  s:'Nach welchen Regeln <em>darf</em> man revidieren? → Lakatos', tw:2400, tx:CW/2});

/* ---- DOM ---- */
nodes.forEach(n=>{
  const d=document.createElement('div');
  d.className='node '+(n.cls||'');
  d.innerHTML=(n.num?`<span class="num">${n.num}</span>`:'')+`<span class="t">${n.t}</span>`+(n.s?`<span class="s">${n.s}</span>`:'');
  cam.appendChild(d); n.el=d;
});

/* ---- Höhen exakt messen: ohne Transform, aufgerundet ---- */
function measure(mode){
  cam.classList.add('measuring');
  const t=cam.style.transform; cam.style.transform='none';
  cam.dataset.mode=mode; cam.dataset.z=(mode==='slide'?'near':'far');
  void cam.offsetHeight;                    // Übergänge sind jetzt wirklich aus
  nodes.forEach(n=>{ n.el.style.width=(mode==='slide'?n.sw:n.tw)+'px'; n.el.style.height='auto'; });
  void cam.offsetHeight;                    // Umbruch bei der neuen Breite erzwingen
  nodes.forEach(n=>{ n[mode==='slide'?'hS':'hT']=Math.ceil(n.el.getBoundingClientRect().height)+6; });
  cam.style.transform=t;
}

function place(n,mode){
  const sl=(mode==='slide');
  n.cx=sl?n.sx:n.tx; n.cy=sl?n.sy:n.ty; n.w=sl?n.sw:n.tw; n.h=sl?n.hS:n.hT;
  const s=n.el.style;
  s.left=(n.cx-n.w/2)+'px'; s.top=(n.cy-n.h/2)+'px'; s.width=n.w+'px'; s.height=n.h+'px';
}

const E={};
let CH=0;
let cur=-1;

/* ---- Vollständige Neuberechnung: messen, stapeln, Kanten zeichnen ---- */
function layout(){
  cam.classList.add('measuring');
  measure('slide'); measure('tree');

  /* Baumanordnung */
  let y=R_TOP;
  TITLE.ty=y+TITLE.hT/2; y=TITLE.ty+TITLE.hT/2+620;
  AGH.ty=y+AGH.hT/2; y+=AGH.hT+70;
  AG.forEach(n=>{ n.ty=y+n.hT/2; y+=n.hT+26; });
  y+=760;
  REGIONS.forEach(R=>{
    R.sec.ty=y+R.sec.hT/2;
    let headTop=y+R.sec.hT+GAP_SEC;
    if(R.cardNode){
      R.cardNode.ty=y+R.sec.hT+170+R.cardNode.hT/2;
      headTop=R.cardNode.ty+R.cardNode.hT/2+210;
    }
    const headH=Math.max(...R.headNodes.map(n=>n.hT));
    R.headNodes.forEach(n=>{ n.hT=headH; n.ty=headTop+headH/2; });
    const kidTop=headTop+headH+GAP_HEAD;
    let bottom=headTop+headH;
    R.headNodes.forEach(n=>{
      let cy=kidTop;
      n.kids.forEach(k=>{ k.ty=cy+k.hT/2; cy+=k.hT+KGAP; });
      bottom=Math.max(bottom, cy-KGAP);
    });
    if(R.synthNode){ R.synthNode.ty=bottom+GAP_SYNTH+R.synthNode.hT/2; bottom=R.synthNode.ty+R.synthNode.hT/2; }
    if(R.qNode){ R.qNode.ty=bottom+GAP_Q+R.qNode.hT/2; bottom=R.qNode.ty+R.qNode.hT/2; }
    y=bottom+R_PITCH;
  });
  FIN.ty=y+FIN.hT/2; y=FIN.ty+FIN.hT/2+560;
  CLOSE.ty=y+CLOSE.hT/2;
  CH=CLOSE.ty+CLOSE.hT/2+400;

  /* Folienanordnung */
  nodes.forEach(n=>{ n.sx=n.tx; n.sy=n.ty; if(!n.hS) n.hS=n.hT; });
  REGIONS.forEach(R=>{
    R.headNodes.forEach(hn=>{
      const cx=Math.min(Math.max(hn.tx, 200+SL_W/2), CW-200-SL_W/2);
      const top=hn.ty-hn.hT/2;
      hn.sx=cx; hn.sy=top+hn.hS/2;
      let y2=top+hn.hS+80;
      if(R.stripNode){ hn.stripY=y2+R.stripNode.hS/2; y2+=R.stripNode.hS+76; }
      hn.kids.forEach(k=>{ if(!k.ex){ k.sx=cx; k.sy=y2+k.hS/2; y2+=k.hS+SL_ROWGAP; } });
      y2=y2-SL_ROWGAP+86;
      hn.kids.forEach(k=>{ if(k.ex){ k.sx=cx; k.sy=y2+k.hS/2; y2+=k.hS; } });
      hn.slideBottom=y2;
    });
  });

  cam.dataset.mode='tree';
  nodes.forEach(n=>place(n,'tree'));
  wires.setAttribute('width',CW); wires.setAttribute('height',CH);

  /* Kanten neu zeichnen */
  edges.forEach(e=>{
    const a=byId[e.a], b=byId[e.b];
    let d;
    if(e.kind==='bus'){
      const bx=a.tx-a.tw/2+46, ay=a.ty+a.hT/2, by=b.ty, bl=b.tx-b.tw/2;
      d=`M ${bx} ${ay} L ${bx} ${by-22} Q ${bx} ${by} ${bx+22} ${by} L ${bl} ${by}`;
    }else{
      const ax=a.tx, ay=a.ty+a.hT/2, bx2=b.tx, by2=b.ty-b.hT/2, m=(by2-ay)/2;
      d=`M ${ax} ${ay} C ${ax} ${ay+m} ${bx2} ${by2-m} ${bx2} ${by2}`;
    }
    if(!e.el){
      e.el=document.createElementNS('http://www.w3.org/2000/svg','path');
      wires.appendChild(e.el); E[e.id]=e.el;
    }
    e.el.setAttribute('d',d);
    e.len=e.el.getTotalLength();
    e.el.style.strokeDasharray=e.len;
    if(!e.el.classList.contains('on')) e.el.style.strokeDashoffset=e.len;
  });
  void cam.offsetHeight;
  requestAnimationFrame(()=>cam.classList.remove('measuring'));
}
layout();

/* Neu berechnen, sobald Schriften geladen sind und bei Größenänderung */
function relayout(){ layout(); if(cur>=0) go(cur); }
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(relayout);
addEventListener('load', relayout);

/* =======================================================================
   SCHRITTE
   ===================================================================== */
const STEPS=[];
STEPS.push({fit:['YY'], vis:['YY'], chap:'Wissenschaftstheorie', cue:'Titel',
  note:'Begrüßung. Einordnung: Kapitel 5 heißt „Theorien und ihre empirische Bewertung“. 5.1 und 5.2 hatten Messung und das Newton-Beispiel. Wir machen die Systematik und enden dort, wo 5.6 Theoriendynamik anfängt.'});
STEPS.push({fit:['AG',...AG.map(n=>n.id)], vis:['AG',...AG.map(n=>n.id)],
  chap:'Wissenschaftstheorie', cue:'Gliederung',
  note:'30 Sekunden, nicht länger. Den roten Faden ansagen: erst das Begriffsgerüst, dann die Gütekriterien, dann ein echter Fall. Und: Alle fünf Abschnitte werden an derselben kleinen Beispieltheorie durchgespielt, die gleich kommt.'});
const ov=R=>{
  const par=R.cardNode?R.cardNode.id:R.secId;
  const a=[R.secId,...R.heads.map((h,i)=>R.id+(i+1)),...R.heads.map((h,i)=>'e-'+par+'-'+R.id+(i+1))];
  if(R.cardNode) a.push(R.cardNode.id,'e-'+R.secId+'-'+R.cardNode.id);
  return a;
};

REGIONS.forEach(R=>{
  STEPS.push({fit:[R.secId], vis:[R.secId], chap:R.chap, cue:R.title.replace(/\s+/g,' '), note:R.intro});
  if(R.cardNode) STEPS.push({fit:[R.secId,R.cardNode.id], vis:[R.secId,R.cardNode.id,'e-'+R.secId+'-'+R.cardNode.id],
    chap:R.chap, cue:'Die Theorie', note:R.card.note});
  STEPS.push({fit:ov(R).filter(x=>!x.startsWith('e-')), vis:ov(R), chap:R.chap, cue:'Überblick',
              note:(R.id==='A')?'Die vier Kästen stehen jetzt da. WICHTIG: das sind vier Schnitte durch dasselbe Objekt, keine Gliederungsebenen. Ankündigen, dass wir in jeden einzeln hineingehen und jedes Mal hierher zurückkehren.':'Überblick über den Abschnitt. Ankündigen, in welcher Reihenfolge wir hineingehen.'});

  R.heads.forEach((H,i)=>{
    const hid=R.id+(i+1);
    const kidIds=H.kids.map((k,j)=>hid+'k'+(j+1));
    const fit=[hid,...kidIds];
    const exIds=kidIds.filter((id,j)=>H.kids[j].ex);
    const norm=kidIds.filter((id,j)=>!H.kids[j].ex);
    let shown=[];
    H.kids.forEach((K,j)=>{
      if(K.ex) return;
      shown=shown.concat(kidIds[j]);
      const last=(shown.length===norm.length);
      STEPS.push({fit:fit.concat(R.stripNode?[R.stripNode.id]:[]),
                  vis:[hid,...shown,...(last?exIds:[])].concat(R.stripNode?[R.stripNode.id]:[]),
                  chap:R.chap, cue:(H.n?H.n+' ':'')+H.t,
                  note:(shown.length===1?(H.note?H.note+'  ':''):'')+K.note});
    });
    STEPS.push({fit:ov(R).filter(x=>!x.startsWith('e-')), vis:ov(R), chap:R.chap, cue:'zurück zum Überblick',
                note:'Verbindungen lösen sich, alle Punkte sind wieder da. Kurz Luft holen, dann weiter mit dem nächsten Punkt.'});
  });

  const all=R.ids.filter(x=>x!==R.qId && !(byId[x]&&/(^| )net( |$)/.test(byId[x].cls||'')));
  const allE=edges.filter(e=>all.includes(e.a)&&all.includes(e.b)).map(e=>e.id);
  STEPS.push({fit:all, vis:[...all,...allE], chap:R.chap, cue:'Gesamtbild',
              note:R.mindnote||'Alles zusammen. Kurz stehen lassen — das ist die Karte des Abschnitts.'});
  if(R.synthId) STEPS.push({fit:all, vis:[...all,...allE], chap:R.chap, cue:'Zielaussage', note:R.synth.note});
  if(R.qId) STEPS.push({fit:[R.qId], vis:[R.qId], chap:R.chap, cue:'Fragen', note:R.qnote});
});
STEPS.push({fit:['FN'], vis:['FN'], chap:'Schluss', cue:'Alles zusammen',
  note:'Die Schlussfolie: dieselbe Theorie, fünfmal aus einer anderen Richtung betrachtet. Zeile für Zeile durchgehen, das ist die Zusammenfassung des ganzen Vortrags.'});
STEPS.push({fit:['ZZ'], vis:['ZZ'], chap:'Schluss', cue:'Übergang',
            note:'Bogen schlagen: Struktur (5.3.1) → Netz (5.3.2) → Holismus (5.4.1) → Tugenden (5.4.2) → der Fall (5.5). Die Frage, die offen bleibt, ist die von 5.6: Nach welchen Regeln darf man revidieren? Danke sagen.'});

/* =======================================================================
   KAMERA + ABLAUF
   ===================================================================== */
function fitTo(ids){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  ids.forEach(id=>{const n=byId[id]; if(!n)return;
    x1=Math.min(x1,n.cx-n.w/2); x2=Math.max(x2,n.cx+n.w/2);
    y1=Math.min(y1,n.cy-n.h/2); y2=Math.max(y2,n.cy+n.h/2);});
  const pad=170, w=x2-x1+2*pad, h=y2-y1+2*pad;
  const vw=innerWidth, vh=innerHeight-46;
  const s=Math.min(vw/w, vh/h, 1.0);
  const cx=(x1+x2)/2, cy=(y1+y2)/2;
  cam.style.transform=`translate(${vw/2}px,${vh/2}px) scale(${s}) translate(${-cx}px,${-cy}px)`;
}
function go(i){
  if(i<0||i>=STEPS.length) return;
  cur=i; const S=STEPS[i], vis=new Set(S.vis);
  const solo=(S.fit.filter(id=>byId[id]&&byId[id].cls==='head').length===1);
  const mode=solo?'slide':'tree';
  cam.dataset.z = solo?'near':'far';
  cam.dataset.mode = mode;
  if(mode==='slide'){
    const hn=byId[S.fit.find(id=>byId[id]&&byId[id].cls==='head')];
    const R=REGIONS.find(r=>r.headNodes&&r.headNodes.indexOf(hn)>=0);
    if(R&&R.stripNode&&hn.stripY!=null){ R.stripNode.sx=hn.sx; R.stripNode.sy=hn.stripY; }
  }
  nodes.forEach(n=>{ place(n,mode); n.el.classList.toggle('on',vis.has(n.id)); });
  edges.forEach(e=>{const on=(mode==='tree')&&vis.has(e.id);
    e.el.classList.toggle('on',on);
    e.el.style.strokeDashoffset=on?0:e.len;});
  fitTo(S.fit);
  document.getElementById('chap').textContent=S.chap;
  document.getElementById('cue').textContent=S.cue||'';
  document.getElementById('ntext').innerHTML=S.note||'';
  document.getElementById('bar').style.width=((i+1)/STEPS.length*100)+'%';
  location.hash=i;
}

/* Uhr */
let t0=null, tick=null;
function clock(){
  const el=document.getElementById('clock');
  if(!t0){el.textContent='00:00';el.classList.remove('run');return;}
  const s=Math.floor((Date.now()-t0)/1000);
  el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  el.classList.add('run');
}
function toggleClock(){
  if(tick){clearInterval(tick);tick=null;t0=null;clock();}
  else{t0=Date.now();tick=setInterval(clock,1000);clock();}
}

addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();go(cur+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(cur-1);}
  else if(k==='Home'){go(0);}
  else if(k==='End'){go(STEPS.length-1);}
  else if(k==='n'||k==='N'){document.getElementById('notes').classList.toggle('on');}
  else if(k==='t'||k==='T'){const h=document.documentElement;
    h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';}
  else if(k==='o'||k==='O'){
    for(let i=cur;i<STEPS.length;i++){ if(STEPS[i].cue==='Gesamtbild'){go(i);return;} }
    go(STEPS.length-1);
  }
  else if(k==='l'||k==='L'){toggleClock();}
  else if(k==='r'||k==='R'){relayout();}
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  else if(k==='?'){document.getElementById('help').classList.toggle('on');}
  else if(k==='Escape'){document.getElementById('help').classList.remove('on');}
});
addEventListener('click',e=>{if(!e.target.closest('#help')) go(cur+1);});
addEventListener('contextmenu',e=>{e.preventDefault();go(cur-1);});
let rt=null;
addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(relayout,160); });

document.documentElement.dataset.theme='light';
go(parseInt(location.hash.slice(1))||0);
</script>
